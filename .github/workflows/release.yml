# Builds a tagged version, attaches the core jar (with sources and javadoc) to a GitHub release, and publishes it to
# the public maven: the `maven` branch, served by GitHub Pages at https://fyzz-dev.github.io/myriad. Essentials and
# the other addons release from their own repositories; the example addon is a code sample and isn't released. Tag with the version in gradle.properties: `git tag v0.1.0 && git push --tags`.

name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: check the tag matches gradle.properties
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but gradle.properties says $version"; exit 1; }
      - name: build and test
        run: ./gradlew build :core:javadocJar
      - name: release notes from the changelog
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '/^## /{p = ($2 == v)} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Myriad $version" > notes.md
      - name: create the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: core/build/libs/*.jar
      - name: publish to the maven branch
        run: |
          ./gradlew publishAllPublicationsToSiteRepository
          git fetch origin maven
          git worktree add maven-branch origin/maven
          cp -r build/maven/. maven-branch/
          cd maven-branch
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -m "Publish ${GITHUB_REF_NAME#v}"
          git push origin HEAD:maven
