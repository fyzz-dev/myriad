# Builds a tagged version and attaches the jars (core, Essentials, the example addon, sources and javadoc) to a GitHub
# release. Tag with the version in gradle.properties: `git tag v0.2.0 && git push --tags`.

name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: check the tag matches gradle.properties
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but gradle.properties says $version"; exit 1; }
      - name: build and test
        run: ./gradlew build :core:javadocJar
      - name: release notes from the changelog
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '/^## /{p = ($2 == v)} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Myriad $version" > notes.md
      - name: create the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            core/build/libs/*.jar
            essentials/build/libs/*.jar
            example-addon/build/libs/*.jar
