base {
	archivesName = "myriad-example-addon"
}

dependencies {
	implementation project(":core")
	// Only so `:example-addon:runClient` also boots the stock modules; the addon does not depend on them.
	runtimeOnly project(":essentials")
}

loom {
	mods {
		"myriad" {
			sourceSet("main", ":core")
		}
		"myriad-essentials" {
			sourceSet("main", ":essentials")
		}
		"myriad-example" {
			sourceSet sourceSets.main
		}
	}
}

loom {
	runs {
		client {
			// ./gradlew :example-addon:runClient -PopenDesktop opens the desktop over the title screen on launch.
			property("myriad.openDesktop", project.hasProperty("openDesktop").toString())
			// -PscreenshotEvery=N saves a screenshot every N seconds.
			if (project.hasProperty("screenshotEvery")) property("myriad.screenshotEvery", project.property("screenshotEvery").toString())
			// -PquickPlay="World name" loads straight into a singleplayer world.
			if (project.hasProperty("quickPlay")) programArgs("--quickPlaySingleplayer", project.property("quickPlay").toString())
		}
	}
}

// The example is for reading, not depending on.
tasks.withType(AbstractPublishToMaven).configureEach { enabled = false }
